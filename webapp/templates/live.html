{% extends "base.html" %}
{% block title %}Live Predictions - CS2 Predictor{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-broadcast"></i> Live Predictions</h2>
    <span class="badge bg-secondary" id="last-updated">Loading...</span>
</div>

<div id="loading" class="text-center py-5">
    <div class="spinner-border text-warning" role="status"></div>
    <p class="text-muted mt-2">Fetching live predictions...</p>
</div>

<div id="empty-state" class="text-center py-5" style="display:none;">
    <i class="bi bi-calendar-x" style="font-size:3rem;color:#6b7280;"></i>
    <p class="text-muted mt-3">No top-tier matches right now</p>
</div>

<div id="match-cards" class="row g-3"></div>
{% endblock %}

{% block scripts %}
<style>
    .match-card { transition: transform 0.15s; cursor: pointer; }
    .match-card:hover { transform: translateY(-2px); border-color: #f97316 !important; }
    .tier-major { background: #f59e0b; color: #000; }
    .tier-tier1 { background: #3b82f6; }
    .best-bet-box { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
                    border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
</style>

<script>
let refreshTimer;

async function loadPredictions() {
    try {
        const res = await fetch('/api/live-predictions');
        const data = await res.json();
        document.getElementById('loading').style.display = 'none';

        const now = new Date();
        document.getElementById('last-updated').textContent =
            'Updated: ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

        if (!data.length) {
            document.getElementById('empty-state').style.display = 'block';
            document.getElementById('match-cards').innerHTML = '';
            return;
        }
        document.getElementById('empty-state').style.display = 'none';
        renderCards(data);
    } catch(e) {
        document.getElementById('loading').innerHTML =
            '<p class="text-danger">Failed to load predictions</p>';
    }
}

function renderCards(matches) {
    const container = document.getElementById('match-cards');
    container.innerHTML = '';
    matches.forEach((m) => {
        const tierClass = m.tier === 'major' ? 'tier-major' : 'tier-tier1';
        const tierLabel = m.tier === 'major' ? 'Major' : 'Tier 1';
        const statusBadge = m.status.toLowerCase().includes('live')
            ? '<span class="badge badge-live ms-2">LIVE</span>'
            : (m.match_time ? '<span class="badge bg-secondary ms-2">' + m.match_time + '</span>' : '');

        const factorsHtml = m.factors.map(f =>
            '<div class="d-flex justify-content-between" style="font-size:0.8rem;">' +
            '<span class="text-muted">' + f.name + '</span>' +
            '<span style="color:#f97316;">' + f.advantage + ' +' + f.impact + '</span></div>'
        ).join('');

        const matchUrl = '/predict?team1=' + encodeURIComponent(m.team1) + '&team2=' + encodeURIComponent(m.team2);

        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        col.innerHTML = `
            <a href="${matchUrl}" class="text-decoration-none">
            <div class="card match-card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span style="font-size:0.85rem;">${m.event}</span>
                    <div>
                        <span class="badge ${tierClass}">${tierLabel}</span>
                        ${statusBadge}
                    </div>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <strong style="color:#e0e0e0;">${m.team1}</strong>
                        <strong style="color:#e0e0e0;">${m.team2}</strong>
                    </div>
                    <div class="prediction-bar mb-2">
                        <div class="t1" style="width:${m.prob1}%">${m.prob1}%</div>
                        <div class="t2" style="width:${m.prob2}%">${m.prob2}%</div>
                    </div>
                    <div class="text-center mb-2">
                        <span style="color:#f97316;font-weight:700;">${m.winner}</span>
                        <span class="badge ${m.confidence >= 65 ? 'bg-success' : m.confidence >= 55 ? 'bg-warning text-dark' : 'bg-secondary'} ms-1">
                            ${m.verdict}
                        </span>
                    </div>
                    <div class="mb-2">${factorsHtml}</div>
                    ${m.best_bet ? `
                    <div class="best-bet-box">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted" style="font-size:0.7rem;text-transform:uppercase;">${m.best_bet.market}</span>
                                <div class="fw-bold" style="color:#22c55e;font-size:0.9rem;">${m.best_bet.pick}</div>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-success" style="font-size:0.85rem;">${m.best_bet.prob}%</span>
                            </div>
                        </div>
                    </div>` : ''}
                    <div class="text-center mt-2">
                        <small class="text-muted"><i class="bi bi-box-arrow-up-right"></i> Full analysis & map picker</small>
                    </div>
                </div>
            </div>
            </a>`;
        container.appendChild(col);
    });
}

loadPredictions();
refreshTimer = setInterval(loadPredictions, 60000);
</script>
{% endblock %}
